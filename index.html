<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Card Designer Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* Couleurs du thème UI */
            --bg-dark: #0f0f0f;
            --panel-bg: #1a1a1a;
            --accent: #ff9800;
            --border: #333;
            
            /* Variables de la Carte (Modifiables via JS) */
            --text-color: #3e2723;
            --stat-color: #3e2723;
            --name-top: 345px; --name-left: 250px;
            --rank-top: 398px; --rank-left: 250px;
            --av-top: 230px; --av-left: 250px; 
            --av-w: 300px; --av-h: auto;
            --av-bright: 100%; --av-contrast: 100%; --av-gray: 0%;
            
            /* Stats Gauche */
            --sl-top: 488px; --sl-left: 175px; 
            --sl-size: 8px; --sl-gap-h: 2px; --sl-gap-v: 31px;
            
            /* Stats Droite */
            --sd-top: 488px; --sd-left: 395px; 
            --sd-size: 8px; --sd-gap-h: 2px; --sd-gap-v: 31px;
        }

        * { box-sizing: border-box; transition: background 0.2s; }
        body { 
            background: var(--bg-dark); 
            color: #eee; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 400px; background: var(--panel-bg); 
            border-right: 2px solid var(--border); 
            display: flex; flex-direction: column; 
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-header h1 { font-size: 18px; margin: 0; color: var(--accent); letter-spacing: 2px; }

        .sidebar-content { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .section { 
            background: #222; border-radius: 8px; border: 1px solid var(--border);
            padding: 15px; margin-bottom: 20px;
        }

        .section-title { 
            font-size: 11px; font-weight: bold; color: var(--accent); 
            text-transform: uppercase; margin-bottom: 15px; 
            display: flex; align-items: center; gap: 8px;
        }

        /* --- UI ELEMENTS --- */
        label { font-size: 11px; color: #999; display: block; margin: 8px 0 4px 0; }
        input[type="range"] { width: 100%; height: 4px; border-radius: 2px; accent-color: var(--accent); }
        input[type="text"] { width: 100%; background: #333; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; font-size: 13px; }
        
        .control-group { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .btn-move { 
            background: #333; border: 1px solid #444; color: white; 
            width: 32px; height: 32px; cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-move:hover { background: var(--accent); border-color: var(--accent); }
        .btn-move:active { transform: scale(0.9); }

        .btn-export { 
            width: 100%; padding: 16px; background: #2e7d32; color: white; 
            border: none; border-radius: 6px; font-weight: bold; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 10px;
        }
        .btn-export:hover { background: #388e3c; }

        /* --- VIEWER --- */
        .viewer { 
            flex-grow: 1; display: flex; align-items: center; justify-content: center; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); position: relative;
        }

        .card-container {
            position: relative; width: 500px; height: 730px;
            background-image: url('carte.jpg'); background-size: 100% 100%;
            overflow: hidden; box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            background-color: white; /* Fallback */
        }

        #avatar-img { 
            position: absolute; top: var(--av-top); left: var(--av-left);
            width: var(--av-w); height: var(--av-h);
            transform: translate(-50%, -50%); z-index: 1; pointer-events: none;
            filter: brightness(var(--av-bright)) contrast(var(--av-contrast)) grayscale(var(--av-gray));
        }

        .overlay-input { 
            position: absolute; background: transparent !important; border: none !important; 
            text-align: center; outline: none; z-index: 5; transform: translate(-50%, -50%);
            color: var(--text-color); font-weight: bold; padding: 0;
        }

        #name-field { top: var(--name-top); left: var(--name-left); font-family: 'Algerian', serif; font-size: 28px; width: 450px; }
        #rank-field { top: var(--rank-top); left: var(--rank-left); font-family: 'Agency FB', sans-serif; font-size: 22px; width: 350px; }

        /* Stats Layers */
        .stats-layer { position: absolute; display: flex; flex-direction: column; z-index: 10; }
        .l-side { top: var(--sl-top); left: var(--sl-left); gap: var(--sl-gap-v); }
        .r-side { top: var(--sd-top); left: var(--sd-left); gap: var(--sd-gap-v); }

        .stat-row { display: flex; align-items: center; height: 16px; }
        .sq { border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.1); cursor: pointer; }
        .sq.sl { width: var(--sl-size); height: var(--sl-size); margin-right: var(--sl-gap-h); }
        .sq.sd { width: var(--sd-size); height: var(--sd-size); margin-right: var(--sd-gap-h); }
        .sq.active { background: var(--stat-color) !important; box-shadow: 0 0 5px rgba(0,0,0,0.2); }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1><i class="fa-solid fa-scroll"></i> SHINOBI EDITOR</h1>
        </div>

        <div class="sidebar-content">
            <button class="btn-export" onclick="doExport()"><i class="fa-solid fa-camera"></i> GÉNÉRER PNG</button>
            <p style="font-size: 9px; text-align: center; color: #666; margin-top: 5px;">Fonctionnera à 100% après publication en ligne.</p>

            <div class="section">
                <div class="section-title"><i class="fa-solid fa-image"></i> Portrait</div>
                <input type="file" id="fileInput" style="margin-bottom: 10px; font-size: 11px;">
                
                <label>Taille & Échelle</label>
                <input type="range" min="50" max="600" value="300" oninput="set('--av-w', this.value+'px')">
                <input type="range" min="0" max="600" value="0" oninput="set('--av-h', this.value == 0 ? 'auto' : this.value+'px')">

                <label>Position Précise</label>
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <button class="btn-move" onclick="move('--av-top', -5)"><i class="fa-solid fa-chevron-up"></i></button>
                    <div style="display: flex; gap: 40px;">
                        <button class="btn-move" onclick="move('--av-left', -5)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="btn-move" onclick="move('--av-left', 5)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <button class="btn-move" onclick="move('--av-top', 5)"><i class="fa-solid fa-chevron-down"></i></button>
                </div>

                <label>Filtres Photo</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><label>Lumière</label><input type="range" min="0" max="200" value="100" oninput="set('--av-bright', this.value+'%')"></div>
                    <div><label>Gris</label><input type="range" min="0" max="100" value="0" oninput="set('--av-gray', this.value+'%')"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title"><i class="fa-solid fa-chart-simple"></i> Statistiques Gauche</div>
                <label>Taille des carrés</label>
                <input type="range" min="4" max="25" value="8" oninput="set('--sl-size', this.value+'px')">
                <label>Espace horizontal / Vertical</label>
                <input type="range" min="0" max="15" value="2" oninput="set('--sl-gap-h', this.value+'px')">
                <input type="range" min="10" max="50" value="31" oninput="set('--sl-gap-v', this.value+'px')">
                <div class="control-group" style="margin-top: 10px;">
                    <button class="btn-move" onclick="move('--sl-top', -1)">↑</button>
                    <button class="btn-move" onclick="move('--sl-top', 1)">↓</button>
                    <button class="btn-move" onclick="move('--sl-left', -1)">←</button>
                    <button class="btn-move" onclick="move('--sl-left', 1)">→</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title"><i class="fa-solid fa-chart-column"></i> Statistiques Droite</div>
                <label>Taille des carrés</label>
                <input type="range" min="4" max="25" value="8" oninput="set('--sd-size', this.value+'px')">
                <label>Espace horizontal / Vertical</label>
                <input type="range" min="0" max="15" value="2" oninput="set('--sd-gap-h', this.value+'px')">
                <input type="range" min="10" max="50" value="31" oninput="set('--sd-gap-v', this.value+'px')">
                <div class="control-group" style="margin-top: 10px;">
                    <button class="btn-move" onclick="move('--sd-top', -1)">↑</button>
                    <button class="btn-move" onclick="move('--sd-top', 1)">↓</button>
                    <button class="btn-move" onclick="move('--sd-left', -1)">←</button>
                    <button class="btn-move" onclick="move('--sd-left', 1)">→</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title"><i class="fa-solid fa-palette"></i> Couleurs Globales</div>
                <div style="display: flex; gap: 15px;">
                    <div style="flex:1"><label>Texte</label><input type="color" value="#3e2723" oninput="set('--text-color', this.value)"></div>
                    <div style="flex:1"><label>Stats</label><input type="color" value="#3e2723" oninput="set('--stat-color', this.value)"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="viewer">
        <div id="render-zone" class="card-container">
            <img id="avatar-img" src="">
            <input type="text" id="name-field" class="overlay-input" value="NOM DU PERSONNAGE">
            <input type="text" id="rank-field" class="overlay-input" value="RANG S - SHINOBI">
            
            <div class="stats-layer l-side" id="l-container"></div>
            <div class="stats-layer r-side" id="r-container"></div>
        </div>
    </div>

    <script>
        const root = document.documentElement;

        // 1. Initialisation des Stats
        function initStats(id, rows, sqClass) {
            const container = document.getElementById(id);
            rows.forEach(count => {
                const row = document.createElement('div');
                row.className = 'stat-row';
                for(let i=0; i<count; i++) {
                    const sq = document.createElement('div');
                    sq.className = `sq ${sqClass}`;
                    sq.onclick = function() {
                        const all = row.querySelectorAll('.sq');
                        const index = Array.from(all).indexOf(this);
                        all.forEach((s, idx) => s.classList.toggle('active', idx <= index));
                        saveCurrentState();
                    }
                    row.appendChild(sq);
                }
                container.appendChild(row);
            });
        }
        initStats('l-container', [5,5,5], 'sl');
        initStats('r-container', [6,6,6], 'sd');

        // 2. Gestion Image Avatar
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = document.getElementById('avatar-img');
                img.src = event.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // 3. Fonctions de contrôle
        function set(prop, val) { root.style.setProperty(prop, val); saveCurrentState(); }
        function move(prop, delta) {
            const current = parseFloat(getComputedStyle(root).getPropertyValue(prop)) || 0;
            root.style.setProperty(prop, (current + delta) + 'px');
            saveCurrentState();
        }

        // 4. Export PNG Pro
        function doExport() {
            const zone = document.getElementById('render-zone');
            html2canvas(zone, {
                scale: 3, // HD
                useCORS: true,
                allowTaint: true,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Shinobi_Card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 5. Système de Sauvegarde (LocalStorage)
        function saveCurrentState() {
            const settings = {};
            const props = ['--name-top', '--name-left', '--text-color', '--stat-color', '--sl-top', '--sl-left', '--sd-top', '--sd-left'];
            props.forEach(p => settings[p] = root.style.getPropertyValue(p));
            localStorage.setItem('shinobiSettings', JSON.stringify(settings));
        }

        window.onload = () => {
            const saved = localStorage.getItem('shinobiSettings');
            if(saved) {
                const settings = JSON.parse(saved);
                for(let p in settings) { if(settings[p]) root.style.setProperty(p, settings[p]); }
            }
        };
    </script>
</body>
</html>
