<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SHINOBI DESIGNER PRO - ULTRA PRECISION V4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* VARIABLES DE PRECISION */
        :root {
            --text-color: #3e2723; --stat-color: #3e2723;
            --name-top: 345px; --name-left: 250px; --name-size: 28px; --name-space: 0px;
            --rank-top: 398px; --rank-left: 250px; --rank-size: 22px; --rank-space: 0px;
            --av-top: 230px; --av-left: 250px; --av-w: 300px; --av-h: auto;
            --av-bright: 100%; --av-gray: 0%; --av-contrast: 100%;
            --sl-top: 488px; --sl-left: 175px; --sl-size: 8px; --sl-gap-h: 2.5px; --sl-gap-v: 31px;
            --sd-top: 488px; --sd-left: 395px; --sd-size: 8px; --sd-gap-h: 2.5px; --sd-gap-v: 31px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { background: #050505; color: #dcdcdc; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR PRO */
        .sidebar { width: 450px; background: #111; border-right: 2px solid #222; display: flex; flex-direction: column; z-index: 100; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .sidebar-header { padding: 25px; background: #1a1a1a; border-bottom: 2px solid #ff9800; text-align: center; }
        .sidebar-header h1 { margin: 0; font-size: 20px; color: #ff9800; letter-spacing: 3px; text-transform: uppercase; }
        .sidebar-content { flex-grow: 1; overflow-y: scroll; padding: 20px; }
        
        /* SCROLLBAR CUSTOM */
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .panel { background: #181818; border-radius: 12px; border: 1px solid #282828; padding: 18px; margin-bottom: 20px; }
        .panel-h { font-size: 12px; font-weight: 800; color: #ff9800; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        label { font-size: 11px; color: #888; display: block; margin-top: 12px; font-weight: 600; }
        .unit { float: right; color: #555; font-style: normal; }

        /* CONTROLS */
        .ctrl-group { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        input[type="range"] { flex-grow: 1; accent-color: #ff9800; cursor: pointer; height: 4px; }
        input[type="color"] { background: none; border: none; width: 35px; height: 35px; cursor: pointer; padding: 0; }
        
        .btn-precise { background: #252525; border: 1px solid #333; color: #fff; width: 32px; height: 32px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-precise:hover { background: #ff9800; border-color: #ff9800; color: #000; }

        .btn-download { width: 100%; padding: 20px; background: #c62828; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-download:hover { background: #f44336; box-shadow: 0 0 20px rgba(244, 67, 54, 0.4); transform: translateY(-2px); }

        /* VIEWER */
        .viewer { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; perspective: 1000px; }
        
        /* LA CARTE (Capture Area) */
        .card-body {
            position: relative; width: 500px; height: 730px;
            background-image: url('carte.jpg'); background-size: 100% 100%;
            overflow: hidden; background-color: #fff;
            box-shadow: 0 20px 80px rgba(0,0,0,0.8);
        }

        #avatar-layer { 
            position: absolute; top: var(--av-top); left: var(--av-left);
            width: var(--av-w); height: var(--av-h);
            transform: translate(-50%, -50%); z-index: 1;
            filter: brightness(var(--av-bright)) grayscale(var(--av-gray)) contrast(var(--av-contrast));
            pointer-events: none;
        }

        /* CHAMPS TEXTE FIXÉS */
        .sync-text { 
            position: absolute; background: transparent !important; border: none !important; 
            text-align: center; outline: none; z-index: 10; transform: translate(-50%, -50%);
            color: var(--text-color); font-weight: bold; white-space: nowrap; overflow: visible;
        }
        #name-field { 
            top: var(--name-top); left: var(--name-left); 
            font-family: 'Algerian', 'Times New Roman', serif; 
            font-size: var(--name-size); letter-spacing: var(--name-space); width: 480px; 
        }
        #rank-field { 
            top: var(--rank-top); left: var(--rank-left); 
            font-family: 'Agency FB', 'Arial', sans-serif; 
            font-size: var(--rank-size); letter-spacing: var(--rank-space); width: 400px; 
        }

        /* STATS LAYERS */
        .stats-wrap { position: absolute; display: flex; flex-direction: column; z-index: 20; }
        .wrap-l { top: var(--sl-top); left: var(--sl-left); gap: var(--sl-gap-v); }
        .wrap-r { top: var(--sd-top); left: var(--sd-left); gap: var(--sd-gap-v); }

        .row-s { display: flex; align-items: center; }
        .pixel { border: 1px solid rgba(0,0,0,0.15); background: rgba(255,255,255,0.1); cursor: pointer; transition: 0.1s; }
        
        .pixel.sl { width: var(--sl-size); height: var(--sl-size); margin-right: var(--sl-gap-h); }
        .pixel.sd { width: var(--sd-size); height: var(--sd-size); margin-right: var(--sd-gap-h); }
        .pixel.on { background: var(--stat-color) !important; box-shadow: inset 0 0 2px rgba(0,0,0,0.3); }

    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h1>DESIGNER ULTIME</h1>
    </div>
    
    <div class="sidebar-content">
        <button class="btn-download" onclick="exportFullHD()">
            <i class="fa-solid fa-cloud-arrow-down"></i> Télécharger (Rendu HD)
        </button>

        <div class="panel">
            <div class="panel-h"><i class="fa-solid fa-image-portrait"></i> Portrait du Shinobi</div>
            <input type="file" id="imgIn" style="width:100%; font-size:10px;">
            
            <label>Position Verticale <i class="unit" id="v-avt">0</i></label>
            <div class="ctrl-group">
                <button class="btn-precise" onclick="move('--av-top', -0.5)">-</button>
                <input type="range" min="0" max="730" step="0.5" value="230" oninput="set('--av-top', this.value+'px', 'v-avt')">
                <button class="btn-precise" onclick="move('--av-top', 0.5)">+</button>
            </div>

            <label>Largeur Image <i class="unit" id="v-avw">300</i></label>
            <input type="range" min="50" max="600" step="1" value="300" oninput="set('--av-w', this.value+'px', 'v-avw')">

            <label>Luminosité & Contraste</label>
            <div class="ctrl-group">
                <input type="range" min="0" max="200" value="100" oninput="set('--av-bright', this.value+'%')">
                <input type="range" min="0" max="200" value="100" oninput="set('--av-contrast', this.value+'%')">
            </div>
        </div>

        <div class="panel">
            <div class="panel-h"><i class="fa-solid fa-signature"></i> Nom du Ninja</div>
            <label>Couleurs (Global)</label>
            <div class="ctrl-group">
                <input type="color" value="#3e2723" oninput="set('--text-color', this.value); set('--stat-color', this.value)">
                <span style="font-size:10px; color:#666">Appliquer à tout</span>
            </div>

            <label>Taille Police & Espacement</label>
            <div class="ctrl-group">
                <input type="range" min="10" max="80" step="0.5" value="28" oninput="set('--name-size', this.value+'px')">
                <input type="range" min="-5" max="20" step="0.5" value="0" oninput="set('--name-space', this.value+'px')">
            </div>

            <label>Position Verticale Précise</label>
            <div class="ctrl-group">
                <button class="btn-precise" onclick="move('--name-top', -0.2)">↑</button>
                <input type="range" min="0" max="730" step="0.2" value="345" oninput="set('--name-top', this.value+'px')">
                <button class="btn-precise" onclick="move('--name-top', 0.2)">↓</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-h"><i class="fa-solid fa-list-ol"></i> Statistiques Gauche</div>
            <label>Position du bloc (X / Y)</label>
            <div class="ctrl-group">
                <input type="range" min="0" max="500" step="0.5" value="175" oninput="set('--sl-left', this.value+'px')">
                <input type="range" min="0" max="730" step="0.5" value="488" oninput="set('--sl-top', this.value+'px')">
            </div>
            
            <label>Écart Horizontal <i class="unit" id="v-slh">2.5</i></label>
            <input type="range" min="0" max="15" step="0.1" value="2.5" oninput="set('--sl-gap-h', this.value+'px', 'v-slh')">
            
            <label>Écart Vertical <i class="unit" id="v-slv">31</i></label>
            <input type="range" min="10" max="60" step="0.5" value="31" oninput="set('--sl-gap-v', this.value+'px', 'v-slv')">
        </div>

        <div class="panel">
            <div class="panel-h"><i class="fa-solid fa-list-ol"></i> Statistiques Droite</div>
            <label>Position du bloc (X / Y)</label>
            <div class="ctrl-group">
                <input type="range" min="0" max="500" step="0.5" value="395" oninput="set('--sd-left', this.value+'px')">
                <input type="range" min="0" max="730" step="0.5" value="488" oninput="set('--sd-top', this.value+'px')">
            </div>

            <label>Écart Horizontal <i class="unit" id="v-sdh">2.5</i></label>
            <input type="range" min="0" max="15" step="0.1" value="2.5" oninput="set('--sd-gap-h', this.value+'px', 'v-sdh')">
            
            <label>Écart Vertical <i class="unit" id="v-sdv">31</i></label>
            <input type="range" min="10" max="60" step="0.5" value="31" oninput="set('--sd-gap-v', this.value+'px', 'v-sdv')">
        </div>
    </div>
</div>

<div class="viewer">
    <div id="capture-area" class="card-body">
        <img id="avatar-layer" src="">
        <input type="text" id="name-field" class="sync-text" value="NOM DU NINJA">
        <input type="text" id="rank-field" class="sync-text" value="RANG S - KAGE">
        <div class="stats-wrap wrap-l" id="l-box"></div>
        <div class="stats-wrap wrap-r" id="r-box"></div>
    </div>
</div>

<script>
    const root = document.documentElement;

    // GENERATEUR DE STATS
    function createGrid(boxId, counts, type, sizeVar) {
        const box = document.getElementById(boxId);
        counts.forEach(num => {
            const row = document.createElement('div');
            row.className = 'row-s';
            for(let i=0; i<num; i++) {
                const p = document.createElement('div');
                p.className = `pixel ${type}`;
                p.onclick = function() {
                    const siblings = row.querySelectorAll('.pixel');
                    const idx = Array.from(siblings).indexOf(this);
                    siblings.forEach((s, sIdx) => s.classList.toggle('on', sIdx <= idx));
                };
                row.appendChild(p);
            }
            box.appendChild(row);
        });
    }
    createGrid('l-box', [5,5,5], 'sl', '--sl-size');
    createGrid('r-box', [6,6,6], 'sd', '--sd-size');

    // UPLOAD IMAGE
    document.getElementById('imgIn').onchange = function(e) {
        const r = new FileReader();
        r.onload = (ev) => { document.getElementById('avatar-layer').src = ev.target.result; };
        r.readAsDataURL(e.target.files[0]);
    };

    // CONTROLES
    function set(p, v, unitId) { 
        root.style.setProperty(p, v); 
        if(unitId) document.getElementById(unitId).innerText = parseFloat(v);
    }
    
    function move(p, d) {
        const c = parseFloat(getComputedStyle(root).getPropertyValue(p)) || 0;
        const newVal = (c + d).toFixed(1);
        root.style.setProperty(p, newVal + 'px');
    }

    // --- FONCTION D'EXPORTATION ULTIME (ANTI-DECALAGE) ---
    function exportFullHD() {
        const area = document.getElementById('capture-area');
        
        // On remplace temporairement les Input par des Span pour le rendu exact des polices
        const nameVal = document.getElementById('name-field').value;
        const rankVal = document.getElementById('rank-field').value;
        
        // Option html2canvas pour une précision chirurgicale
        html2canvas(area, {
            scale: 4, // Ultra HD
            useCORS: true,
            allowTaint: true,
            letterRendering: true,
            backgroundColor: null,
            onclone: (clonedDoc) => {
                // Dans la copie de rendu, on s'assure que le texte est traité comme du texte pur
                const n = clonedDoc.getElementById('name-field');
                const r = clonedDoc.getElementById('rank-field');
                n.style.display = 'none';
                r.style.display = 'none';
                
                // Créer des clones visuels parfaits
                const nClone = document.createElement('div');
                nClone.innerText = nameVal;
                nClone.className = "sync-text";
                nClone.style.cssText = n.style.cssText + "; display:block; border:none;";
                
                const rClone = document.createElement('div');
                rClone.innerText = rankVal;
                rClone.className = "sync-text";
                rClone.style.cssText = r.style.cssText + "; display:block; border:none;";
                
                n.parentNode.appendChild(nClone);
                r.parentNode.appendChild(rClone);
            }
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Shinobi_${nameVal.replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
        });
    }
</script>
</body>
</html>
